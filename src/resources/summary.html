<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>@@TITLE@@ — Conversation summary</title>
  <script>
    (() => {
      const key = 'scribe-report-theme';
      const root = document.documentElement;
      const valid = value => value === 'light' || value === 'dark';
      const web = location.protocol === 'http:' || location.protocol === 'https:';
      let saved;
      // Local-file storage may be unavailable or isolated to this particular file.
      try { saved = localStorage.getItem(key); } catch (_) {}
      if (!valid(saved) && web) {
        try {
          const cookie = document.cookie.split(';').map(item => item.trim()).find(item => item.startsWith(key + '='));
          saved = cookie ? cookie.slice(key.length + 1) : null;
        } catch (_) {}
      }
      const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      root.dataset.theme = valid(saved) ? saved : (systemDark ? 'dark' : 'light');
      document.addEventListener('DOMContentLoaded', () => {
        const stamp = document.getElementById('generated-at');
        const generated = stamp && new Date(stamp.getAttribute('datetime'));
        if (generated && Number.isFinite(generated.getTime())) {
          const timeOptions = {hour: '2-digit', minute: '2-digit', hour12: false};
          const fullOptions = {...timeOptions, day: '2-digit', month: 'short', year: 'numeric'};
          function updateGenerationTime() {
            const now = new Date();
            const today = generated.getFullYear() === now.getFullYear() &&
                          generated.getMonth() === now.getMonth() && generated.getDate() === now.getDate();
            stamp.textContent = new Intl.DateTimeFormat('en-GB', today ? timeOptions : fullOptions).format(generated);
            stamp.setAttribute('title', new Intl.DateTimeFormat('en-GB', {...fullOptions, timeZoneName: 'short'}).format(generated));
          }
          updateGenerationTime();
          window.setInterval(updateGenerationTime, 60000);
        }
        const toggle = document.getElementById('theme-toggle');
        const state = document.getElementById('theme-state');
        function apply(theme) {
          root.dataset.theme = theme;
          toggle.setAttribute('aria-checked', String(theme === 'dark'));
          state.textContent = theme === 'dark' ? 'On' : 'Off';
        }
        apply(root.dataset.theme);
        toggle.hidden = false;
        toggle.addEventListener('click', () => {
          const theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
          apply(theme);
          try { localStorage.setItem(key, theme); } catch (_) {}
          if (web) {
            try {
              document.cookie = key + '=' + theme + '; Max-Age=31536000; Path=/; SameSite=Lax' +
                                (location.protocol === 'https:' ? '; Secure' : '');
            } catch (_) {}
          }
        });
        const tabs = [...document.querySelectorAll('[role="tab"]')];
        const panels = [...document.querySelectorAll('[role="tabpanel"]')];
        const picker = document.getElementById('transcript-picker');
        const choice = document.getElementById('transcript-toggle');
        const options = document.getElementById('transcript-options');
        const choiceTitle = document.getElementById('transcript-choice-title');
        const choiceDescription = document.getElementById('transcript-choice-description');
        const transcriptTabs = tabs.filter(tab => tab.id === 'tab-transcript' || tab.id.startsWith('tab-source-'));
        let currentTranscript = transcriptTabs[0], pinned = false, closeTimer;
        function openOptions(open) {
          if (!options) return;
          window.clearTimeout(closeTimer);
          if (!open) pinned = false;
          options.hidden = !open;
          choice.setAttribute('aria-expanded', String(open));
          transcriptTabs.forEach(tab => { tab.tabIndex = open && tab === currentTranscript ? 0 : -1; });
        }
        function updateChoice(tab) {
          if (!choice) return;
          const isTranscript = transcriptTabs.includes(tab);
          if (isTranscript) currentTranscript = tab;
          choiceTitle.textContent = currentTranscript.getAttribute('data-title');
          choiceDescription.textContent = currentTranscript.getAttribute('data-description');
          choice.setAttribute('data-active', String(isTranscript));
          transcriptTabs.forEach(item => item.setAttribute('data-current', String(item === currentTranscript)));
        }
        function select(tab) {
          tabs.forEach(item => {
            const active = item === tab;
            item.setAttribute('aria-selected', String(active));
            item.tabIndex = active ? 0 : -1;
          });
          panels.forEach(panel => { panel.hidden = panel.id !== tab.getAttribute('aria-controls'); });
          updateChoice(tab);
          openOptions(false);
        }
        if (choice) {
          picker.setAttribute('data-enhanced', 'true');
          choice.hidden = false;
          updateChoice(tabs.find(tab => tab.getAttribute('aria-selected') === 'true'));
          openOptions(false);
          choice.addEventListener('click', () => {
            if (pinned) openOptions(false);
            else { pinned = true; openOptions(true); }
          });
          choice.addEventListener('pointerenter', event => { if (event.pointerType === 'mouse') openOptions(true); });
          picker.addEventListener('pointerenter', () => window.clearTimeout(closeTimer));
          picker.addEventListener('pointerleave', () => {
            closeTimer = window.setTimeout(() => {
              if (!pinned && !options.contains(document.activeElement)) openOptions(false);
            }, 160);
          });
          picker.addEventListener('focusout', event => {
            if (!picker.contains(event.relatedTarget)) openOptions(false);
          });
          picker.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
              event.preventDefault(); openOptions(false); choice.focus();
            } else if (event.target === choice && ['ArrowDown', 'ArrowUp', 'Enter', ' '].includes(event.key)) {
              event.preventDefault(); openOptions(true);
              (event.key === 'ArrowUp' ? transcriptTabs[transcriptTabs.length - 1] : currentTranscript).focus();
            }
          });
          document.addEventListener('pointerdown', event => {
            if (!picker.contains(event.target)) openOptions(false);
          });
        }
        tabs.forEach((tab, index) => {
          tab.addEventListener('click', () => {
            select(tab);
            if (transcriptTabs.includes(tab)) choice.focus();
          });
          tab.addEventListener('keydown', event => {
            let next;
            if (event.key === 'ArrowRight') next = (index + 1) % tabs.length;
            else if (event.key === 'ArrowLeft') next = (index - 1 + tabs.length) % tabs.length;
            else if (event.key === 'Home') next = 0;
            else if (event.key === 'End') next = tabs.length - 1;
            else if (transcriptTabs.includes(tab) && ['ArrowDown', 'ArrowUp'].includes(event.key)) {
              const offset = event.key === 'ArrowDown' ? 1 : -1;
              next = tabs.indexOf(transcriptTabs[(transcriptTabs.indexOf(tab) + offset + transcriptTabs.length) % transcriptTabs.length]);
            }
            else return;
            event.preventDefault();
            select(tabs[next]);
            openOptions(transcriptTabs.includes(tabs[next]));
            tabs[next].focus();
          });
        });
      });
    })();
  </script>
  <style>
    :root { color-scheme: light; --page: #f4f5f7; --surface: #fff; --ink: #243044; --strong: #182230; --secondary: #475467; --muted: #667085; --line: #e4e7ec; --line-soft: #f0f1f3; --control-border: #d0d5dd; --accent: #334d73; --focus: #5276a5; --shadow: #18223004; --dot-brief: #6d8c7e; --dot-overview: #718baa; --dot-expanded: #9480a0; --dot-detailed: #a38b68; }
    :root[data-theme="dark"] { color-scheme: dark; --page: #11151c; --surface: #1a202a; --ink: #d7dfea; --strong: #edf2f8; --secondary: #c1cbd9; --muted: #a2aec1; --line: #344051; --line-soft: #2b3544; --control-border: #4d5c70; --accent: #acc5e8; --focus: #acc5e8; --shadow: #00000018; --dot-brief: #94b8a5; --dot-overview: #9aafd0; --dot-expanded: #b7a0c5; --dot-detailed: #c0a783; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    .page { max-width: 1040px; margin: 48px auto 32px; padding: 0 28px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--secondary); font-size: 13px; font-weight: 650; letter-spacing: .03em; }
    .mark { display: inline-grid; place-items: center; width: 28px; height: 28px; border: 1px solid var(--control-border); border-radius: 7px; background: var(--surface); color: var(--accent); font-family: Georgia, serif; font-size: 20px; }
    .theme-toggle { display: inline-flex; align-items: center; gap: 10px; min-height: 38px; padding: 7px 12px; border: 1px solid var(--control-border); border-radius: 999px; background: var(--surface); color: var(--secondary); font: inherit; font-size: 12px; cursor: pointer; }
    .theme-toggle:hover { border-color: var(--accent); color: var(--strong); }
    .theme-state { min-width: 19px; color: var(--muted); font-size: 11px; text-align: right; }
    .switch-track { position: relative; width: 28px; height: 16px; border-radius: 999px; background: var(--control-border); }
    .switch-track::before { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); }
    [aria-checked="true"] .switch-track { background: var(--accent); }
    [aria-checked="true"] .switch-track::before { transform: translateX(12px); }
    .report { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 4px 20px var(--shadow); }
    header { padding: 34px 40px 28px; }
    .eyebrow { margin: 0 0 26px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; }
    .meeting-facts { display: grid; gap: 22px; margin: 0; }
    .fact { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 16px; align-items: baseline; }
    dt { margin: 0; color: var(--muted); font-size: 14px; font-weight: 500; }
    dd { margin: 0; color: var(--strong); font-size: 30px; font-weight: 500; line-height: 1.32; letter-spacing: -.025em; overflow-wrap: anywhere; }
    h1 { margin: 0; font: inherit; }
    .participants { font-size: 26px; line-height: 1.5; letter-spacing: -.015em; }
    .participant-role { color: var(--muted); font-size: .76em; font-weight: 400; letter-spacing: 0; }
    .source { margin: 26px 0 0; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.8; overflow-wrap: anywhere; }
    .source strong { color: var(--secondary); font-weight: 500; }
    .tabs-wrap { position: sticky; top: 0; z-index: 1; padding: 0 40px; background: var(--surface); border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line); }
    [role="tablist"] { display: flex; flex-wrap: wrap; gap: 0 20px; overflow: visible; }
    [role="tab"] { flex: 0 0 auto; min-height: 76px; padding: 14px 2px 12px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font: inherit; font-size: 14px; font-weight: 600; text-align: left; cursor: pointer; }
    .tab-title { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
    .tab-description { display: block; margin-top: 6px; padding-left: 35px; font-size: 11px; font-weight: 400; }
    .detail-dots { display: inline-grid; grid-template-columns: repeat(5, 3.5px); justify-content: center; align-content: center; gap: 2px; width: 28px; height: 18px; color: var(--dot-detailed); }
    .detail-dots[data-count="1"] { grid-template-columns: 3.5px; color: var(--dot-brief); }
    .detail-dots[data-count="2"] { grid-template-columns: repeat(2, 3.5px); }
    .detail-dots[data-count="3"] { grid-template-columns: repeat(3, 3.5px); }
    .detail-dots[data-count="4"] { grid-template-columns: repeat(4, 3.5px); }
    .detail-dots[data-count="2"], .detail-dots[data-count="3"] { color: var(--dot-overview); }
    .detail-dots[data-count="4"], .detail-dots[data-count="5"] { color: var(--dot-expanded); }
    .detail-dots .dot { display: block; width: 3.5px; height: 3.5px; border-radius: 50%; background: currentColor; }
    [role="tab"][aria-selected="true"] { border-bottom-color: var(--accent); color: var(--accent); }
    [role="tab"]:hover { color: var(--ink); }
    .model-name { font-size: 11px; font-weight: 500; }
    .icon-slot { display: inline-grid; place-items: center; width: 28px; height: 18px; }
    .transcript-icon { display: block; position: relative; width: 14px; height: 16px; border: 1.4px solid currentColor; border-radius: 2px; }
    .transcript-icon::after { content: ""; position: absolute; top: 4px; left: 3px; width: 6px; height: 1px; background: currentColor; box-shadow: 0 3px currentColor, 0 6px currentColor; }
    :root { --selected-line: #b5763d; --selected-fill: #fbf4ec; }
    :root[data-theme="dark"] { --selected-line: #c99765; --selected-fill: #302820; }
    .transcript-picker { position: relative; display: flex; align-items: center; width: 270px; max-width: 100%; }
    #transcript-toggle { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 60px; margin: 7px 0; padding: 10px 12px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--ink); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
    #transcript-toggle[data-active="true"] { border-color: var(--selected-line); background: var(--selected-fill); }
    #transcript-toggle:hover { background: var(--line-soft); }
    .picker-copy { display: grid; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
    #transcript-choice-title { font-weight: 600; }
    #transcript-choice-description { color: var(--muted); font-size: 11px; }
    .picker-arrow { flex-shrink: 0; color: var(--muted); }
    [aria-expanded="true"] .picker-arrow { transform: rotate(180deg); }
    #transcript-options { width: 100%; padding: 6px; background: var(--surface); }
    [data-enhanced="true"] #transcript-options { position: absolute; top: 100%; right: 0; z-index: 2; width: 300px; max-width: calc(100vw - 48px); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px var(--shadow); }
    #transcript-options [role="tab"] { position: relative; display: block; width: 100%; min-height: 64px; margin: 0; padding: 10px 27px 10px 10px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--ink); font-size: 13px; white-space: normal; }
    #transcript-options .tab-title { display: block; white-space: normal; overflow-wrap: anywhere; }
    #transcript-options .icon-slot { display: none; }
    #transcript-options .model-name { font: inherit; }
    #transcript-options .tab-description { margin: 0; padding: 0; }
    #transcript-options [role="tab"]:hover { background: var(--line-soft); }
    #transcript-options [data-current="true"] { border-color: var(--selected-line); background: var(--selected-fill); }
    #transcript-options [data-current="true"]::after { content: "✓"; position: absolute; right: 9px; top: 11px; color: var(--selected-line); }
    .option-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 5px; }
    .processing-badge { flex-shrink: 0; max-width: 48%; padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--line-soft); color: var(--secondary); font-size: 11px; font-weight: 500; overflow-wrap: anywhere; }
    .menu-heading { margin: 6px 4px 0; padding: 12px 6px 7px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; border-radius: 3px; }
    [role="tab"]:focus-visible { outline-offset: -5px; }
    [role="tabpanel"] { padding: 26px 40px 36px; }
    [hidden] { display: none !important; }
    .panel-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 25px; padding-bottom: 18px; border-bottom: 1px solid var(--line-soft); }
    h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
    .panel-heading > span { flex-shrink: 0; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .prose { max-width: 76ch; font-size: 16px; line-height: 1.8; overflow-wrap: anywhere; }
    .prose p { margin: 0 0 1.2em; white-space: pre-wrap; }
    .prose p:last-child { margin-bottom: 0; }
    .transcript-content { margin-top: 24px; white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 4; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; line-height: 1.85; }
    footer { display: flex; justify-content: space-between; gap: 16px; padding: 18px 3px; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .generation-stamp { white-space: nowrap; }
    @media (max-width: 640px) {
      .page { margin: 20px auto; padding: 0 12px; }
      .toolbar { margin: 0 8px 16px; gap: 12px; }
      header { padding: 28px 24px 24px; }
      .fact { grid-template-columns: 1fr; gap: 7px; }
      dd { font-size: 27px; }
      .participants { font-size: 23px; }
      .tabs-wrap { padding: 0 24px; }
      [role="tablist"] { gap: 24px; }
      [role="tabpanel"] { padding: 26px 24px 32px; }
      .panel-heading { flex-direction: column; gap: 8px; }
      .prose { font-size: 15px; line-height: 1.75; }
      footer { padding: 16px 8px; flex-direction: column; gap: 4px; }
    }
    @media print {
      :root, :root[data-theme="dark"] { color-scheme: light; --page: #f4f5f7; --surface: #fff; --ink: #243044; --strong: #182230; --secondary: #475467; --muted: #667085; --line: #e4e7ec; --line-soft: #f0f1f3; --control-border: #d0d5dd; --accent: #334d73; --focus: #5276a5; --shadow: #18223004; --dot-brief: #6d8c7e; --dot-overview: #718baa; --dot-expanded: #9480a0; --dot-detailed: #a38b68; }
      body { background: #fff; }
      .page { max-width: none; margin: 0; padding: 0; }
      .toolbar, .tabs-wrap, footer { display: none; }
      .report { border: 0; box-shadow: none; }
      header { padding: 0 0 20px; }
      [role="tabpanel"] { padding: 0; }
      .prose { max-width: none; font-size: 11pt; }
      .transcript-content { font-size: 9pt; }
      .panel-heading { break-after: avoid; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="toolbar">
      <div class="brand"><span class="mark" aria-hidden="true">s</span> Scribe</div>
      <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-label="Dark Mode" aria-checked="false" hidden>
        <span>Dark Mode</span><span class="switch-track" aria-hidden="true"></span><span id="theme-state" class="theme-state" aria-hidden="true">Off</span>
      </button>
    </div>
    <article class="report">
      <header>
        <p class="eyebrow">Conversation summary</p>
        <dl class="meeting-facts">
          <div class="fact"><dt>Topic:</dt><dd><h1>@@TOPIC@@</h1></dd></div>
          <div class="fact"><dt>Participants:</dt><dd class="participants">@@PARTICIPANTS@@</dd></div>
          <div class="fact"><dt>Duration:</dt><dd>@@DURATION@@</dd></div>
          <div class="fact"><dt>Date:</dt><dd>@@DATE@@</dd></div>
        </dl>
        <p class="source"><strong>Source</strong> · @@SOURCE@@@@DATE_NOTE@@<br>@@CONTENTS@@</p>
      </header>
      <nav class="tabs-wrap" aria-label="Report navigation">
        <div role="tablist" aria-label="Report sections">@@TABS@@</div>
      </nav>
      @@PANELS@@
    </article>
    <footer><span>Automatic summary · Review important details against the source.</span><span class="generation-stamp">Generated <time id="generated-at" datetime="@@GENERATED_ISO@@" title="@@GENERATED_FULL@@">@@GENERATED_FULL@@</time></span></footer>
    <noscript><p>Enable JavaScript to switch tabs. The first selected tab is shown above.</p></noscript>
  </main>

</body>
</html>
